name = "vinetrack-satellite-pilot-scheduler"
main = "worker.ts"
compatibility_date = "2026-10-19"
[vars]
# Phase A (default): cron ticks fire and are logged in Cloudflare, but the
# handler returns before any network call. No HTTP request, no backend
# satellite_ingest_runs receipt — the Cloudflare log line is the only evidence.
SCHEDULER_ENABLED = "false"
# Cron triggers are declared here so Wrangler manages them. They are safe in
# phase A because the disabled handler makes zero outbound HTTP requests.
# Note: commenting this block out does NOT remove already-deployed triggers;
# only `crons = []` clears a Wrangler-managed schedule.
[triggers]
crons = ["0 2 * * *", "*/10 * * * *"]
# One-time owner setup — see README.md in this directory for the full
# dashboard-only and CLI procedures, secret rotation, and phase B criteria.
