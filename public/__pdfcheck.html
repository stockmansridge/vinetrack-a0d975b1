<!doctype html><html><body><button id="b">go</button>
<script type="module">
import { parseSprayReportPayload } from "/src/lib/sprayReportV1.ts";
import { saveSprayReportPdf, buildSprayReportPdf } from "/src/lib/sprayReportPdf.ts";
window.run = async () => {
  const raw = await (await fetch("/__fx.json")).json();
  raw.rows = Array.from({length:140},(_,i)=>({...raw.rows[0], rowNumber:i+1}));
  const { payload, errors } = parseSprayReportPayload(raw);
  if (!payload) return { errors };
  const doc = buildSprayReportPdf(payload, {});
  const pages = doc.internal.getNumberOfPages();
  const name = saveSprayReportPdf(payload, {});
  return { pages, name };
};
</script></body></html>
